name: Publish Semlens CLI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run npm publish as a dry run
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      authentication:
        description: Registry authentication (bootstrap requires separate approval)
        required: true
        default: trusted
        type: choice
        options:
          - trusted
          - bootstrap

permissions:
  contents: read
  id-token: write

concurrency:
  group: desk-rules-cli-npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @semlens/cli
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - name: Validate publication inputs
        env:
          AUTHENTICATION: ${{ inputs.authentication }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          case "$AUTHENTICATION" in trusted|bootstrap) ;; *) exit 1 ;; esac
          case "$DRY_RUN" in true|false) ;; *) exit 1 ;; esac

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Pin trusted-publishing npm client
        run: npm install --global npm@11.12.1

      - name: Verify source export fingerprint
        run: npm run check:export

      - name: Install exact dependencies
        run: npm ci

      - name: Build and test
        run: npm run build && npm test && npm run check:package

      - name: Inspect package tarball
        run: npm pack --dry-run --json --workspace @semlens/cli > npm-pack.json

      - name: Generate CycloneDX SBOM
        run: npm run sbom --silent > semlens-cli.cdx.json

      - name: Upload release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: desk-rules-cli-release-evidence
          path: |
            npm-pack.json
            semlens-cli.cdx.json
          if-no-files-found: error

      - name: Publish through trusted publisher
        if: inputs.authentication == 'trusted'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --workspace @semlens/cli --access public --provenance --dry-run
          else
            npm publish --workspace @semlens/cli --access public --provenance
          fi

      - name: Bootstrap first publication
        if: inputs.authentication == 'bootstrap'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const metadata = JSON.parse(readFileSync('package/package.json', 'utf8'));
          if (metadata.name !== '@semlens/cli' || metadata.version !== '0.5.0') {
            throw new Error('Bootstrap requires @semlens/cli@0.5.0.');
          }
          if (!process.env.NODE_AUTH_TOKEN) throw new Error('Approved bootstrap credential is missing.');
          if (!['true', 'false'].includes(process.env.DRY_RUN)) throw new Error('Invalid dry-run input.');
          const registry = 'https://registry.npmjs.org';
          const lookup = spawnSync('npm', ['view', metadata.name, '--registry', registry, '--json'], { encoding: 'utf8' });
          let result;
          try { result = JSON.parse(lookup.stdout); } catch { throw new Error('Registry lookup did not return structured evidence.'); }
          if (lookup.status === 0 || lookup.error || lookup.status === null || result?.error?.code !== 'E404') {
            throw new Error('Bootstrap requires an explicit package-not-found registry response.');
          }
          const args = ['publish', '--workspace', '@semlens/cli', '--registry', registry, '--access', 'public', '--provenance'];
          if (process.env.DRY_RUN === 'true') args.push('--dry-run');
          const publish = spawnSync('npm', args, { stdio: 'inherit' });
          if (publish.error || publish.status === null) throw new Error('Publication command could not complete.');
          process.exit(publish.status);
          NODE
